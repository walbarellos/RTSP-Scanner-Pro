<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTSP INTELLIGENCE v8.6 - Cleanup Master</title>
    <style>
        :root { 
            --green: #00ff41; 
            --red: #ff2244; 
            --bg: #050505; 
            --panel: #111;
            --text-dim: #666;
            --cyan: #4af;
            --star: #ffcc00;
        }
        * { box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--green); 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
        }
        
        .layout { 
            display: grid; 
            grid-template-columns: 350px 1fr; 
            gap: 20px; 
            width: 100%;
            max-width: 1800px;
        }
        
        .sidebar { 
            background: var(--panel); 
            padding: 20px; 
            border: 1px solid #333; 
            height: calc(100vh - 40px); 
            display: flex; 
            flex-direction: column; 
            position: sticky; 
            top: 20px; 
        }
        .v-tag { font-size: 0.6em; color: #444; float: right; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #000; border: 1px solid #222; padding: 10px; text-align: center; }
        .stat-val { display: block; font-size: 1.5em; font-weight: bold; color: #fff; }
        .stat-lbl { font-size: 0.6em; color: var(--text-dim); text-transform: uppercase; }

        .btn-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }
        button { 
            border: none; 
            padding: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: inherit; 
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-main { background: var(--green); color: #000; }
        .btn-sec  { background: var(--cyan); color: #000; }
        .btn-warn { background: #222; color: var(--red); border: 1px solid var(--red); }
        
        .log { flex: 1; overflow-y: auto; background: #000; border: 1px solid #222; padding: 10px; font-size: 0.7em; color: #777; }

        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 15px; 
        }
        
        .card { background: var(--panel); border: 1px solid #222; border-radius: 4px; overflow: hidden; position: relative; }
        .card.confirmed { border: 2px solid var(--green); box-shadow: 0 0 15px rgba(0,255,65,0.1); }
        .card.failed { opacity: 0.3; filter: grayscale(1); }

        .preview { height: 170px; background: #000; display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 1px solid #222; }
        .preview img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge { position: absolute; top: 8px; left: 8px; padding: 3px 6px; font-size: 0.6em; font-weight: bold; border-radius: 2px; }
        .badge-anal { background: var(--cyan); color: #000; }
        .badge-live { background: var(--green); color: #000; }
        .swarm-text { color: var(--star); font-weight: bold; border: 1px solid var(--star); padding: 2px 4px; border-radius: 3px; font-size: 0.9em; margin-right: 5px; }

        .btn-star { 
            position: absolute; top: 8px; right: 40px; 
            background: rgba(0,0,0,0.7); color: #888; 
            border: 1px solid #333; width: 28px; height: 28px; 
            border-radius: 4px; cursor: pointer; z-index: 10;
        }
        .btn-star.active { color: var(--star); border-color: var(--star); }

        .btn-kill { 
            position: absolute; top: 8px; right: 8px; 
            background: rgba(255,0,0,0.3); color: #fff; 
            border: 1px solid rgba(255,0,0,0.5); width: 28px; height: 28px; 
            border-radius: 4px; cursor: pointer; z-index: 10; font-weight: bold;
        }

        .info { padding: 12px; font-size: 0.75em; }
        .ip { font-size: 1.1em; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .meta { color: #666; margin-bottom: 8px; }
        
        .actions { display: grid; grid-template-columns: 1fr 35px; gap: 4px; }
        .btn-view { background: var(--green); color: #000; padding: 8px; font-size: 0.8em; }
        .btn-gear { background: #222; color: var(--cyan); border: 1px solid var(--cyan); }

        .tab-switcher { display: flex; gap: 2px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; background: #222; color: #666; border: 1px solid #333; font-size: 0.7em; cursor: pointer; }
        .tab-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); }

        #modal-debug { 
            display: none; position: fixed; inset: 40px; 
            background: #000; border: 1px solid var(--green); 
            z-index: 1000; flex-direction: column; padding: 20px; 
        }
        #debug-out { flex: 1; overflow-y: auto; background: #050505; color: var(--green); padding: 15px; font-size: 0.8em; white-space: pre-wrap; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .analyzing-text { font-size: 0.7em; color: var(--cyan); animation: pulse 1.5s infinite; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div style="margin-bottom: 20px;">
                <span class="v-tag">v8.8.0</span>

                <h2 style="margin:0; letter-spacing:3px;">RECON</h2>
            </div>

            <div class="stat-grid">
                <div class="stat-box">
                    <span id="scanned" class="stat-val">0</span>
                    <span class="stat-lbl">Audited</span>
                </div>
                <div class="stat-box" style="border-color: var(--green);">
                    <span id="confirmed" class="stat-val" style="color:var(--green);">0</span>
                    <span class="stat-lbl">Live</span>
                </div>
            </div>

            <div class="stat-box" style="margin-bottom: 20px;">
                <span id="target" class="stat-val" style="font-size: 1em;">IDLE</span>
                <span class="stat-lbl">Network Block</span>
            </div>

            <div class="btn-group">
                <input type="text" id="target-input" placeholder="IP or CIDR (ex: 103.213.193.0/24)" style="padding:10px; background:#000; border:1px solid #333; color:var(--green); font-family:inherit; margin-bottom:5px; font-size:0.7em;">
                <button class="btn-sec" onclick="jumpToTarget()" style="margin-bottom:10px; background:var(--star);">⚡ JUMP TO TARGET</button>
                <button class="btn-main" onclick="initScan()">Connect Neural Link</button>
                <button class="btn-sec"  onclick="skipNet()">Skip Block</button>
                <button class="btn-warn" onclick="purge()">Clear Non-Live</button>
            </div>

            <div class="tab-switcher">
                <button onclick="switchTab('recon')" id="t-recon" class="tab-btn active">RECONNAISSANCE</button>
                <button onclick="switchTab('book')"  id="t-book"  class="tab-btn">MISSION BOOK</button>
            </div>

            <div id="log" class="log"></div>
        </div>

        <div class="gallery-container">
            <div id="gallery" class="gallery"></div>
            <div id="gallery-book" class="gallery" style="display:none;"></div>
        </div>
    </div>

    <div id="modal-debug">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <h3 style="margin:0; font-size:0.9em;">[PROTOCOL_LAB_RAW]</h3>
            <button onclick="closeDebug()" style="background:none; color:var(--red); border:none; font-size:1.5em; cursor:pointer;">&times;</button>
        </div>
        <div id="debug-out"></div>
    </div>

    <script>
        const state = {
            confirmed: new Set(),
            analyzing: new Set(),
            bookmarked: new Set(),
            activeTab: 'recon',
            eventSource: null
        };

        function log(msg) {
            const div = document.createElement('div');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            const container = document.getElementById('log');
            container.prepend(div);
            if(container.children.length > 50) container.lastChild.remove();
        }

        function skipNet() { fetch('/api/scan/rir/skip', {method:'POST'}); log('SKIP COMMAND SENT'); }
        function purge() { document.querySelectorAll('.card:not(.confirmed)').forEach(c => c.remove()); state.analyzing.clear(); }

        async function toggleStar(ip, btn) {
            const isSaved = state.bookmarked.has(ip);
            const newState = isSaved ? 0 : 1;
            if(newState) { state.bookmarked.add(ip); btn.classList.add('active'); log(`PINNED: ${ip}`); }
            else { state.bookmarked.delete(ip); btn.classList.remove('active'); log(`UNPINNED: ${ip}`); }
            await fetch(`/api/bookmark?ip=${ip}&state=${newState}`, {method:'POST'});
            if(state.activeTab === 'book') loadBook();
        }

        async function syncBookmarks() {
            try {
                const r = await fetch('/api/bookmark/ids');
                const ids = await r.json();
                state.bookmarked = new Set(ids);
            } catch(e) {}
        }

        function switchTab(t) {
            state.activeTab = t;
            document.getElementById('gallery').style.display = t === 'recon' ? 'grid' : 'none';
            document.getElementById('gallery-book').style.display = t === 'book' ? 'grid' : 'none';
            document.getElementById('t-recon').className = `tab-btn ${t === 'recon' ? 'active' : ''}`;
            document.getElementById('t-book').className  = `tab-btn ${t === 'book' ? 'active' : ''}`;
            if(t === 'book') loadBook();
        }

        async function jumpToTarget() {
            const target = document.getElementById('target-input').value;
            if(!target) return;
            log(`JUMPING TO: ${target}`);
            await fetch(`/api/scan/inject?target=${encodeURIComponent(target)}`, {method:'POST'});
            document.getElementById('target-input').value = '';
        }

        async function loadBook() {
            const r = await fetch('/api/results?bookmarked=1');
            const data = await r.json();
            const g = document.getElementById('gallery-book');
            g.innerHTML = '';
            data.forEach(d => {
                const card = document.createElement('div');
                card.className = 'card confirmed';
                card.innerHTML = `
                    <button class="btn-star active" onclick="toggleStar('${d.ip}', this)">★</button>
                    <div class="preview"><img src="/api/live?url=${encodeURIComponent(d.working_url)}"></div>
                    <div class="info">
                        <div class="ip">${d.ip}</div>
                        <div class="meta" style="color:var(--green);">${d.vendor} | ${d.res}</div>
                        <button class="btn-view" onclick="window.open('/api/live?url=${encodeURIComponent(d.working_url)}','_blank')">STREAM</button>
                    </div>
                `;
                g.appendChild(card);
            });
        }

        function initScan() {
            syncBookmarks();
            if (state.eventSource) state.eventSource.close();
            state.eventSource = new EventSource('/api/scan/rir');
            
            // Watchdog: Remove cards travados em "Probing" > 60s
            setInterval(() => {
                const now = Date.now();
                document.querySelectorAll('.card:not(.confirmed)').forEach(c => {
                    const ts = parseInt(c.dataset.ts);
                    if (now - ts > 60000) {
                        state.analyzing.delete(c.id.replace('c-','').replace(/-/g,'.'));
                        c.remove();
                    }
                });
            }, 30000);

            state.eventSource.addEventListener('status', e => log(JSON.parse(e.data).msg));
            state.eventSource.addEventListener('network', e => document.getElementById('target').innerText = JSON.parse(e.data).net);
            state.eventSource.addEventListener('progress', e => {
                const d = JSON.parse(e.data);
                document.getElementById('scanned').innerText = d.scanned.toLocaleString();
                document.getElementById('confirmed').innerText = d.confirmed;
            });

            state.eventSource.addEventListener('found_hw', e => {
                const d = JSON.parse(e.data);
                if (state.confirmed.has(d.ip) || state.analyzing.has(d.ip)) return;
                state.analyzing.add(d.ip);
                const card = document.createElement('div');
                card.id = `c-${d.ip.replace(/\./g, '-')}`;
                card.className = 'card';
                card.dataset.ts = Date.now();
                card.innerHTML = `
                    <button class="btn-kill" onclick="this.parentElement.remove(); state.analyzing.delete('${d.ip}')">&times;</button>
                    <button class="btn-star" onclick="toggleStar('${d.ip}', this)">★</button>
                    <div class="preview"><span class="badge badge-anal">PROBING</span><div class="analyzing-text">ANALYZING...</div></div>
                    <div class="info"><div class="ip">${d.ip}</div><div class="meta">${d.cc} | ${d.rir}</div>
                    <div class="actions"><button class="btn-view" disabled>INTERROGATING</button><button class="btn-gear" onclick="debug('${d.ip}')">⚙</button></div></div>
                `;
                document.getElementById('gallery').prepend(card);
            });

            state.eventSource.addEventListener('confirmed', e => {
                const d = JSON.parse(e.data);
                state.confirmed.add(d.ip);
                state.analyzing.delete(d.ip);
                const card = document.getElementById(`c-${d.ip.replace(/\./g, '-')}`);
                if (card) {
                    card.className = 'card confirmed';
                    const starred = state.bookmarked.has(d.ip) ? 'active' : '';
                    card.innerHTML = `
                        <button class="btn-kill" onclick="this.parentElement.remove()">&times;</button>
                        <button class="btn-star ${starred}" onclick="toggleStar('${d.ip}', this)">★</button>
                        <div class="preview"><span class="badge badge-live">● LIVE</span><img src="/api/live?url=${encodeURIComponent(d.url)}" onerror="this.outerHTML='<div style=\'color:red\'>CODEC ERROR</div>'"></div>
                        <div class="info">
                            <div class="ip">${d.ip}</div>
                            <div class="meta" style="color:var(--green); font-weight:bold;">
                                ${d.vendor.includes('(Swarm)') ? `<span class="swarm-text">SWARM</span>` : ''}
                                ${d.vendor.replace('(Swarm)', '')} | ${d.res}
                            </div>
                            <div class="actions">
                                <button class="btn-view" onclick="window.open('/api/live?url=${encodeURIComponent(d.url)}','_blank')">FULLSCREEN</button>
                                <button class="btn-gear" onclick="debug('${d.ip}')">⚙</button>
                            </div>
                        </div>

                    `;
                }
            });

            state.eventSource.addEventListener('failed_probe', e => {
                const d = JSON.parse(e.data);
                state.analyzing.delete(d.ip);
                const card = document.getElementById(`c-${d.ip.replace(/\./g, '-')}`);
                if (card && !state.confirmed.has(d.ip)) {
                    card.classList.add('failed');
                    setTimeout(() => { if(!state.bookmarked.has(d.ip)) card.remove(); }, 3000);
                }
            });
        }

        async function debug(ip) {
            const m = document.getElementById('modal-debug');
            const out = document.getElementById('debug-out');
            m.style.display = 'flex';
            out.innerText = `Interrogating ${ip}...\n`;
            try {
                const r = await fetch(`/api/debug/probe?ip=${ip}`);
                const data = await r.json();
                data.log.forEach((step, i) => { out.innerText += `\n--- TRANSACTION ${i+1} ---\n> SENT:\n${step.req}\n< RECEIVED:\n${step.resp}`; });
            } catch(e) { out.innerText += `\nERROR: ${e}`; }
        }
        function closeDebug() { document.getElementById('modal-debug').style.display = 'none'; }
    </script>
</body>
</html>
